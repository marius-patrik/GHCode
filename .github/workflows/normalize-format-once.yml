name: Normalize formatting on integration PR
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.pull_request.number == 16 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ghcode-format-pr-16
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Apply actual Biome formatting, preserving source semantics
        run: bun run format
      - name: Commit formatted files on isolated branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src rsbuild.config.ts package.json tsconfig.json biome.json components.json
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: normalize GHCode sources using the existing Biome config"
          git push origin "HEAD:refs/heads/$HEAD_REF"
