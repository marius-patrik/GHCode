name: One-time Biome normalization
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 16 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ghcode-one-time-format-16
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run format
      - name: Commit only actual Biome changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src rsbuild.config.ts package.json tsconfig.json biome.json components.json
          if git diff --cached --quiet; then
            echo "Formatting already matches Biome."
            exit 0
          fi
          git commit -m "style: normalize native UI and governance sources"
          git push origin "HEAD:refs/heads/$HEAD_REF"
