            TAG="v0.1.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          gh release create "$TAG" ghcode-site.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "Published $TAG from $GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - name: Upload GHCode site as a Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Pages from Actions artifact
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GHCode
        id: deployment
        uses: actions/deploy-pages@v4
