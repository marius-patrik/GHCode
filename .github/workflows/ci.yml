name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main pushes serialize release tags; PR checks remain independently queued.
concurrency:
  group: ghcode-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-publish' || format('check-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Lint, typecheck, and build
        run: bun run check
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser acceptance
        run: bun run acceptance

  package:
    name: Package GHCode from validated main
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ vars.WORKBENCH_OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_AUTH_BROKER_URL: ${{ vars.WORKBENCH_AUTH_BROKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build standalone GHCode
        run: |
          bun install
          bun run build
          test -s dist/index.html
      - name: Save immutable build for matching GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: ghcode-dist
          path: dist
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - name: Upload GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  release:
    name: Create GitHub release for main commit
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ghcode-dist
          path: dist
      - name: Publish next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/index.html
          cd dist
          zip -q -r ../ghcode-site.zip .
          cd ..
          # Serial workflow concurrency makes patch-tag allocation deterministic.
          PREVIOUS="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1 || true)"
          if [[ -z "$PREVIOUS" ]]; then
            TAG="v0.1.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          gh release create "$TAG" ghcode-site.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  deploy:
    name: Deploy Pages from Actions artifact
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GHCode
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages source and public response
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "GitHub Pages configuration:"
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type, status, html_url, source}'; then
            build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
            if [[ "$build_type" != "workflow" ]]; then
              echo "::error::Pages is still configured for branch publishing ($build_type). Change Settings > Pages > Build and deployment > Source to GitHub Actions."
              exit 1
            fi
          else
            echo "::warning::Unable to read Pages settings with GITHUB_TOKEN."
          fi
          for attempt in {1..9}; do
            code="$(curl -sSL -o /tmp/ghcode-public-index -w '%{http_code}' --max-time 25 "$PAGE_URL" || true)"
            echo "Public Pages HTTP status (attempt $attempt): $code"
            if [[ "$code" == "200" ]] && grep -qi '<html' /tmp/ghcode-public-index; then
              echo "GHCode is publicly readable at $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployment API succeeded, but the public GHCode homepage is not returning HTML over HTTP 200 at $PAGE_URL"
          exit 1
