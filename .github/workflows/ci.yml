name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main pushes serialize release tags; PR checks remain independently queued.
concurrency:
  group: ghcode-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-publish' || format('check-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Lint, typecheck, and build
        run: bun run check
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser acceptance
        run: bun run acceptance

  package:
    name: Package GHCode from validated main
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcode-pages-staging
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ vars.WORKBENCH_OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_AUTH_BROKER_URL: ${{ vars.WORKBENCH_AUTH_BROKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build standalone GHCode
        run: |
          bun install
          bun run build
          test -s dist/index.html
      - name: Save immutable build for matching GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: ghcode-dist
          path: dist
          if-no-files-found: error
      - name: Stage successful main without deleting PR snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          stage="$RUNNER_TEMP/main-pages-staging"
          mkdir -p "$stage"
          cd "$stage"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin gh-pages
          git switch -C gh-pages FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rsync -a --delete --exclude='.git/' --exclude='pr-*/' "$GITHUB_WORKSPACE/dist/" "$stage/"
          test -s index.html
          touch .nojekyll
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pages(main): stage validated ${GITHUB_SHA:0:12}"
            git push origin HEAD:gh-pages
          fi

  release:
    name: Create GitHub release for main commit
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ghcode-dist
          path: dist
      - name: Publish next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/index.html
          cd dist
          zip -q -r ../ghcode-site.zip .
          cd ..
          # Serial workflow concurrency makes patch-tag allocation deterministic.
          PREVIOUS="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1 || true)"
          if [[ -z "$PREVIOUS" ]]; then
            TAG="v0.1.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          gh release create "$TAG" ghcode-site.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  deploy:
    name: Deploy complete main and preview site with Pages Actions
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: ghcode-pages-actions
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted publication logic from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Assemble independently staged main and open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-staging"
          git init -q "$RUNNER_TEMP/staging-repo"
          git -C "$RUNNER_TEMP/staging-repo" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/staging-repo" fetch --depth 1 origin gh-pages
          git -C "$RUNNER_TEMP/staging-repo" archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/pages-staging"
          open="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')"
          mapfile -t prs < <(printf '%s\n' "$open" | sed '/^$/d')
          python .github/scripts/assemble_pages.py --staging "$RUNNER_TEMP/pages-staging" --site site --open-prs "${prs[@]}"
          test -s site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish main and PR previews with GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public main and mark existing PR previews successful
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            code="$(curl -sSL -o "$RUNNER_TEMP/index" -w '%{http_code}' --max-time 25 "$PAGE_URL" || true)"
            [ "$code" = 200 ] && grep -qi '<html' "$RUNNER_TEMP/index" && break
            sleep 8
          done
          [ "$code" = 200 ] && grep -qi '<html' "$RUNNER_TEMP/index" || exit 1
          for preview in site/pr-*; do
            [ -s "$preview/.preview-head" ] || continue
            pr="${preview##*/pr-}"
            [[ "$pr" =~ ^[0-9]+$ ]] || continue
            recorded="$(cat "$preview/.preview-head")"
            latest="$(gh pr view "$pr" --json headRefOid --jq .headRefOid 2>/dev/null || true)"
            [ -n "$latest" ] && [ "$recorded" = "$latest" ] || continue
            deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=pr-$pr&per_page=100"               --jq ".[] | select(.sha == \"$recorded\") | .id" | head -n 1)"
            [ -n "$deployment" ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses"               -f state=success -f environment_url="${PAGE_URL%/}/pr-$pr/"               -f description="Published through GitHub Pages"
          done
