name: Standalone HTML
on:
  pull_request:
    paths:
      - "src/**"
      - "rsbuild.config.ts"
      - "package.json"
      - "index.html"
      - ".github/workflows/standalone-html.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Build a standalone HTML
        run: |
          bun run build:standalone
          test -s dist/index.html
          if grep -Eiq '<script[^>]+src=|<link[^>]+rel="stylesheet"' dist/index.html; then
            echo "::error::Standalone bundle contains external JS/CSS links"
            exit 1
          fi
      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-single-html
          path: dist/index.html
          if-no-files-found: error
